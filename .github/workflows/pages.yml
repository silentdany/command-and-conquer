name: Training page

# Rebuilds and publishes the training page (GitHub Pages) on every push:
# the page runs the add-on's own Lua files, so it follows the add-on.
# One-time setup: Settings > Pages > Source = GitHub Actions (and, to
# publish from a branch other than main, allow it in Settings >
# Environments > github-pages).

on:
  push:
    branches: [main, claude/vigilant-archimedes-96uwzo, ccr-68b5b91f-h12h49]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lua 5.1, Pillow, wasmoon
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          pip install pillow
          npm ci --prefix web

      - name: Do not publish a broken wheel
        run: |
          lua5.1 tools/wheelsim.lua
          node tools/websim-check.mjs

      - name: Build the page
        run: node tools/build-web.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
