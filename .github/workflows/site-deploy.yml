name: Redeploy the website

# The website (silentdany/cnc-site) fetches this add-on's Lua files and icons
# at build time. Every push on main asks Vercel to rebuild it, so the site's
# wheel is always the add-on's wheel.
# Needs the repository secret SITE_DEPLOY_HOOK_URL (Vercel deploy hook).

on:
  push:
    branches: [main]
    paths:
      - "CommandAndConquer/**"
      - "tools/sim/**"
  workflow_dispatch:

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::SITE_DEPLOY_HOOK_URL is not set, the website was not redeployed."
            exit 0
          fi
          curl -fsS -X POST --retry 3 "$HOOK" > /dev/null
          echo "Website redeploy requested."
