name: Tests

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (WoW's Lua version)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax check (add-on, test add-on, tools, page glue)
        run: |
          for f in CommandAndConquer/*.lua probe/CnCProbe/*.lua tools/*.lua tools/sim/*.lua; do
            luac5.1 -p "$f"
            echo "ok $f"
          done

      - name: TOC lists existing files only
        run: |
          for toc in CommandAndConquer/CommandAndConquer.toc probe/CnCProbe/CnCProbe.toc; do
            dir=$(dirname "$toc")
            grep -v '^#' "$toc" | grep -v '^\s*$' | while read -r f; do
              f=$(echo "$f" | tr -d '\r')
              test -f "$dir/$f" || { echo "missing $dir/$f"; exit 1; }
            done
          done

      - name: Every icon and wheel texture used exists
        run: |
          for icon in $(grep -o 'icon = "[a-z]*"' CommandAndConquer/Data.lua | sed 's/icon = "//;s/"//' | sort -u) cancel; do
            test -f "CommandAndConquer/Media/icons/$icon.tga" || { echo "missing icon $icon"; exit 1; }
          done
          for n in $(grep -o '{ n = [0-9]*' CommandAndConquer/Wheel.lua | grep -o '[0-9]*' | sort -u); do
            for part in fill border; do
              test -f "CommandAndConquer/Media/sector${n}_${part}.tga" || { echo "missing sector${n}_${part}"; exit 1; }
            done
          done

      - name: Wheel simulation, Lua 5.1 (WoW API and secure snippets emulated)
        run: lua5.1 tools/wheelsim.lua

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Same simulation in Lua 5.4 (wasmoon, runtime of the training page)
        run: |
          npm ci --prefix web
          node tools/websim-check.mjs

      - name: Training page builds
        run: |
          pip install pillow
          node tools/build-web.mjs
